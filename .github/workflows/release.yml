name: Release
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  # Runs all third-party build code (pnpm postinstalls, Go toolchain) with no
  # privileges: no OIDC identity and no writable token.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false
      - name: Validate tag
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH" >&2; exit 1; }
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # go.mod replaces the waypoint SDK modules with ../waypoint; clone the
      # public monorepo as a sibling of the workspace.
      - name: Checkout waypoint SDK (sibling)
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/waypointos/waypoint.git "${GITHUB_WORKSPACE}/../waypoint"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Build dashboard panel
        run: cd dashboard && pnpm install --frozen-lockfile && pnpm build
      - name: Build .raw
        run: make -f build/Makefile raw VERSION="${VERSION}"
      - name: Manifest
        run: |
          set -euo pipefail
          SHA="$(sha256sum "dist/so100-${VERSION}.raw" | cut -d' ' -f1)"
          (cd build && go run ./manifest -toml ../module.toml -version "${VERSION}" -sha256 "${SHA}") > dist/manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/so100-*.raw
            dist/manifest.json
          if-no-files-found: error

  # Holds the cosign OIDC identity and the writable release token; runs no
  # third-party build code, only signs and publishes what `build` produced.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # cosign keyless OIDC; the proxy pins this workflow's SAN
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Sign .raw (cosign keyless)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cosign sign-blob --yes --new-bundle-format \
            --bundle "dist/so100-${VERSION}.raw.cosign" \
            "dist/so100-${VERSION}.raw"
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/so100-*.raw
            dist/so100-*.raw.cosign
            dist/manifest.json
