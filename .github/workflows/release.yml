name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write   # cosign keyless OIDC; the proxy pins this workflow's SAN

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Set VERSION
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build dashboard panel
        run: cd dashboard && pnpm install --frozen-lockfile && pnpm build
      - name: Build .raw
        run: make -f build/Makefile raw VERSION="${VERSION}"
      - name: Sign .raw (cosign keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes --new-bundle-format \
            --bundle "dist/so100-${VERSION}.raw.cosign" \
            "dist/so100-${VERSION}.raw"
      - name: Manifest
        run: |
          set -euo pipefail
          SHA="$(sha256sum "dist/so100-${VERSION}.raw" | cut -d' ' -f1)"
          (cd build && go run ./manifest -toml ../module.toml -version "${VERSION}" -sha256 "${SHA}") > dist/manifest.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/so100-${{ env.VERSION }}.raw
            dist/so100-${{ env.VERSION }}.raw.cosign
            dist/manifest.json
