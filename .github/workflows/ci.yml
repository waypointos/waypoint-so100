name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: cd dashboard && pnpm install --frozen-lockfile
      - run: cd dashboard && pnpm test
      - run: cd dashboard && pnpm build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # go.mod replaces the waypoint SDK modules with ../waypoint; clone the
      # public monorepo as a sibling of the workspace.
      - name: Checkout waypoint SDK (sibling)
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/waypointos/waypoint.git "${GITHUB_WORKSPACE}/../waypoint"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
