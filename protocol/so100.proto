syntax = "proto3";

package waypoint.module.so100.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/waypointos/waypoint-so100/protocol/gen/go;so100v1";

// ---- tab -> backend ----
message ArmCommand {
  oneof action {
    bool run_calibration    = 1;  // start a manual range-recording session (torque off, operator sweeps each joint)
    bool abort              = 2;  // stop the running session, discard, torque off
    bool finish_calibration = 3;  // stop recording, derive + save: zeros from the home pose, soft limits from the sweep
    bool set_home           = 4;  // capture the current pose as the zero (0 rad) for every joint
    bool        set_torque   = 5;  // true = enable torque on every joint (hold), false = disable (pose by hand)
    PoseCapture capture_pose = 6;  // save the arm's current physical pose into a slot
    string      delete_pose  = 7;  // clear the named slot ("share" | "options")
    string      recall_pose  = 8;  // recall the named slot now (the on-screen teleop button; gamepad recalls the same path)
  }
}

// capture_pose payload: which slot to bind, and an operator-facing label.
message PoseCapture { string slot = 1; string name = 2; }

// ---- backend -> tab: which slots hold a pose (Arm tab + teleop legend) ----
message PoseSlot  { string slot = 1; string name = 2; bool assigned = 3; }
message PoseState { repeated PoseSlot slots = 1; }

// ---- backend -> tab ----
message CalibrationState {
  google.protobuf.Timestamp t = 1;
  string phase = 2;            // "idle" | "recording" | "done" | "aborted"
  uint32 active_joint = 3;     // unused in manual recording (kept for wire compat), 0
  repeated JointCalibration joints = 4;
  bool home_set = 5;           // true once the home pose has been captured this session
}

message JointCalibration {
  uint32 id            = 1;
  optional uint32 raw_min       = 2;  // N/A until measured
  optional uint32 raw_max       = 3;
  optional double zero_raw      = 4;
  optional uint32 soft_min      = 5;
  optional uint32 soft_max      = 6;
  optional int32  measured_span = 7;
  optional int32  expected_span = 8;
  bool   ok          = 9;
  string flag_reason = 10;     // "" | "no read" | "no home pose" | "home outside swept range" | "seam in workspace"
}

// ---- wire-compatible mirror of waypoint.v1 servo.proto (Plan 1) ----
message ServoControl {
  uint32 servo_id = 1;
  oneof op {
    uint32      set_mode              = 2;
    bool        set_torque_enable     = 3;
    uint32      set_goal_position     = 4;
    uint32      set_torque_limit      = 5;
    AngleLimits set_angle_limits      = 6;
    uint32      set_overcurrent_limit = 7;
  }
}
message AngleLimits { uint32 min_raw = 1; uint32 max_raw = 2; }
message ServoReadRequest { uint32 servo_id = 1; }
message ServoState {
  uint32 servo_id = 1;
  optional uint32 position_raw  = 2;
  optional sint32 speed_raw     = 3;
  optional sint32 load_raw      = 4;
  optional uint32 current_raw   = 5;
  optional uint32 voltage_deci  = 6;
  optional uint32 temperature_c = 7;
  bool moving              = 8;
  bool overcurrent_tripped = 9;
  bool ok                  = 10;
}

// Wire-compatible with waypoint.v1.GamepadSnapshot (agent mirrors raw bytes).
message GamepadSnapshot {
  google.protobuf.Timestamp t = 1;
  repeated float axes     = 2;
  repeated bool  buttons  = 3;
  repeated float triggers = 4;
}

// Wire-compatible with waypoint.v1.ServoSyncWrite / ServoGoal (agent relays raw bytes).
message ServoGoal      { uint32 servo_id = 1; uint32 goal_position = 2; }
message ServoSyncWrite { repeated ServoGoal goals = 1; }

// Module-internal: calibrated joint angles for the render window.
message Joint {
  uint32 id              = 1;
  optional float angle_rad = 2;   // absent => N/A
  string na_reason       = 3;     // populated when angle_rad is absent
}
message JointAngles { repeated Joint joints = 1; }

// Module-internal: full per-servo telemetry for the Arm tab's MOTOR DETAIL
// card. One entry per servo id; a servo that failed to read surfaces as
// ok=false with its scalar fields absent (rendered N/A, never fake zeros).
message ServoStats {
  google.protobuf.Timestamp t = 1;
  repeated ServoState servos  = 2;
}
